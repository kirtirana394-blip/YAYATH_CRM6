<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>99Acres CRM Login</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="login-page"><div class="card login-card"><h1>99Acres CRM</h1><p class="muted">Secure sales workspace for 99Acres leads</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash flash-{{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><label>Email</label><input class="input" type="email" name="email" required><label>Password</label><input class="input" type="password" name="password" required style="margin-top:8px"><button class="btn btn-primary" style="width:100%;margin-top:14px">Login</button></form></div></body></html>
