{% extends 'base.html' %}{% block content %}<div class="toolbar"><div><h1>Edit Property</h1><span class="muted">{{property.property_id}} · imported listing</span></div></div><div class="card"><form method="post" class="formgrid"><div><label>Property ID</label><input class="input" name="property_id" value="{{property.property_id}}" required></div><div><label>Property Name *</label><input class="input" name="property_name" value="{{property.property_name}}" required></div><div><label>Property Type</label><input class="input" name="property_type" value="{{property.property_type or ''}}"></div><div><label>Location</label><input class="input" name="location" value="{{property.location or ''}}"></div><div><label>Address / Society</label><input class="input" name="address" value="{{property.address or ''}}"></div><div><label>City</label><input class="input" name="city" value="{{property.city or ''}}"></div><div><label>Size</label><input class="input" name="size" value="{{property.size or ''}}"></div><div><label>Price</label><input class="input" name="price" value="{{property.price or ''}}"></div><div><label>Status</label><select class="select" name="availability_status">{% for status in ['Available','Reserved','Sold','Rented','Inactive'] %}<option{% if property.availability_status==status %} selected{% endif %}>{{status}}</option>{% endfor %}</select></div><div class="full"><label>Description</label><textarea name="description">{{property.description or ''}}</textarea></div><div class="full"><button class="btn btn-primary">Save Changes</button> <a class="btn btn-light" href="{{url_for('properties')}}">Cancel</a></div></form></div>{% endblock %}
