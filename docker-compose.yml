services:
  crm:
    build: .
    ports: ["5000:5000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://crm:crm@db:5432/crm
    command: ["sh", "-c", "flask --app app init-db && python app.py"]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [crm_data:/var/lib/postgresql/data]
volumes:
  crm_data:
