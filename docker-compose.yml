services:
  crm:
    build: .
    ports: ["5000:5000"]
    environment:
      SECRET_KEY: change-me
      DATABASE_URL: postgresql+psycopg://crm:crm@db:5432/crm
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ChangeMeImmediately!
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    volumes: [crm_data:/var/lib/postgresql/data]
volumes:
  crm_data:
